<!DOCTYPE html>
<html lang="en">

<head>
  <title>Certificate Requester</title>
  <script src="https://unpkg.com/htmx.org@1.9.4/dist/htmx.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="css/style.css" rel="stylesheet">
</head>

<!-- Licensed under the GPL v3.0 -->

<body>
  <div class="container">
    <div id="main">
      <b>
        <p align="center"><a target="_blank" href="https://git.bulgariu.xyz/raul/cert400">Source Code</a></p>
        <p align="center"><a href="cacert">Download CA certificate</a></p>
      </b>

      <h1>Certificate Requester</h1>
      <form id='form' hx-encoding='multipart/form-data' hx-post='/api/upload'>
        Serial Number:
        <input type="text" name="formSerNum" value="{{ .default_serial_number }}">
        <br>

        Organization:
        <input type="text" name="formOrg" value="{{ .default_organization }}">
        <br>

        Country:
        <input type="text" name="formCountry" value="{{ .default_country }}">
        <br>

        Province:
        <input type="text" name="formProv" value="{{ .default_province }}">
        <br>

        Locality:
        <input type="text" name="formLocal" value="{{ .default_locality }}">
        <br>

        Street Address:
        <input type="text" name="formStreet" value="{{ .default_street_address }}">
        <br>

        Postal code:
        <input type="text" name="formPostal" value="{{ .default_postal_code }}">
        <br>

        # of years before expiring:
        <input type="text" name="formAge" value="{{ .default_not_after }}">
        <br>

        Certificate Bitsize:
        <input type="text" name="formBit" value="{{ .default_rsa_bitsize }}">
        <br>

        DNS name:
        <input type="text" name="formDNS" value="{{ .default_dns_name }}">
        <br>

        <button id="but">
          Request
        </button>
      </form>

    </div>

  </div>
</body>

</html>
